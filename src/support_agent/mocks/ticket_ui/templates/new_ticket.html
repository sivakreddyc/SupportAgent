{% extends "base.html" %}
{% block title %}New ticket{% endblock %}
{% block content %}
<div class="card" style="max-width: 640px;">
  <h1>New ticket</h1>
  <p class="muted">Create a ticket as a customer would. The agent discovers it on its next poll.</p>
  {% if error %}<p class="error" data-testid="new-ticket-error">{{ error }}</p>{% endif %}
  <form method="post" action="/tickets/new" data-testid="new-ticket-form">
    <p><label>Customer email<br>
      <input name="customer_email" type="email" required style="width:100%" value="{{ form.customer_email or '' }}" data-testid="new-ticket-email"></label></p>
    <p><label>Subject<br>
      <input name="subject" required style="width:100%" value="{{ form.subject or '' }}" data-testid="new-ticket-subject"></label></p>
    <p><label>Message<br>
      <textarea name="body" rows="8" required style="width:100%" data-testid="new-ticket-body">{{ form.body or '' }}</textarea></label></p>
    <p><label>Priority<br>
      <select name="priority" data-testid="new-ticket-priority">
        <option value="">(none)</option>
        {% for p in ["low", "normal", "high", "urgent"] %}
        <option value="{{ p }}" {% if form.priority == p %}selected{% endif %}>{{ p }}</option>
        {% endfor %}
      </select></label></p>
    <button type="submit" data-testid="new-ticket-submit">Create ticket</button>
    <a href="/tickets" style="margin-left: 12px;">Cancel</a>
  </form>
</div>
{% endblock %}
