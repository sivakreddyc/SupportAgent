{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<div class="card" style="max-width: 360px; margin: 40px auto;">
  <h1>Log in</h1>
  {% if error %}<p class="error" data-testid="login-error">{{ error }}</p>{% endif %}
  <form method="post" action="/login" data-testid="login-form">
    <input type="hidden" name="next" value="{{ next }}" data-testid="login-next">
    <p><label>Username<br><input name="username" autocomplete="username" data-testid="login-username"></label></p>
    <p><label>Password<br><input name="password" type="password" autocomplete="current-password" data-testid="login-password"></label></p>
    <button type="submit" data-testid="login-submit">Log in</button>
  </form>
</div>
{% endblock %}
