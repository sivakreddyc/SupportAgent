[project]
name = "support-agent"
version = "0.1.0"
description = "Autonomous support agent: browser-driven ticket discovery, LLM triage, policy gating, human review."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.47",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "itsdangerous>=2.2",
    "httpx>=0.27",
    "aiosqlite>=0.20",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pyyaml>=6.0",
    "anthropic>=0.70",
    "structlog>=24.4",
    "prometheus-client>=0.20",
    "streamlit>=1.38",
    "pandas>=2.2",
    "altair>=5.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-timeout>=2.3",
    "respx>=0.21",
    "ruff>=0.6",
]

[project.scripts]
support-agent = "support_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/support_agent"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
timeout = 120
markers = [
    "live: calls the real Anthropic API (needs ANTHROPIC_API_KEY)",
    "e2e: starts the full stack",
    "load: load/backpressure tests",
    "browser: needs Playwright Chromium installed",
]
